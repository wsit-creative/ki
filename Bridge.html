<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Bridge</title></head>
<body><script>
'use strict';
const ALLOWED_PARENT_ORIGIN = <?!= JSON.stringify(allowedOrigin) ?>;
const ALLOWED_ACTIONS = new Set(['publicProducts','checkVoucher','createOrder','adminLogin','adminLogout','adminProducts','saveProduct','setProductActive','adminVoucherRules','saveVoucherRule','setVoucherStatus','adminOrders','updateOrderStatus','confirmPickup','cancelOrder']);
function send(data){window.parent.postMessage(data,ALLOWED_PARENT_ORIGIN)}
window.addEventListener('message',function(event){
  if(event.source!==window.parent || event.origin!==ALLOWED_PARENT_ORIGIN)return;
  const d=event.data||{};
  if(d.type!=='API_REQUEST'||typeof d.id!=='string'||d.id.length>100||!ALLOWED_ACTIONS.has(d.action))return;
  google.script.run
    .withSuccessHandler(function(result){send({type:'API_RESPONSE',id:d.id,result:result})})
    .withFailureHandler(function(err){send({type:'API_RESPONSE',id:d.id,error:String(err&&err.message||'Permintaan backend gagal').slice(0,300)})})
    .api(d.action,d.payload||{});
});
window.addEventListener('load',function(){send({type:'BRIDGE_READY'})});
</script></body></html>
